name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  # The Windows package only builds for version tags (and manual runs): pushes to main just run the tests.
  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get install -y -q zip
      - name: The tag matches the version in lib/version.js
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./lib/version.js').VERSION")" = "$GITHUB_REF_NAME"
      - name: Download the bundled ffmpeg
        run: bash scripts/fetch-vendor.sh
      - run: bash scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PodGrip-Windows
          path: dist/*.zip
          retention-days: 14

  # Install the package on real Windows, read LTC with the bundled ffmpeg, and let the updater install it.
  windows-smoke-test:
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: PodGrip-Windows, path: dist }
      - name: Install with the user-facing installer
        shell: pwsh
        run: |
          Expand-Archive (Get-Item dist/PodGrip-*-Windows.zip).FullName -DestinationPath build
          $setup = Get-ChildItem build -Directory | Select-Object -First 1
          & powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $setup.FullName "install.ps1") -Silent
          $ext = Join-Path $env:APPDATA "Adobe\CEP\extensions\PodGrip"
          foreach ($f in "CSXS\manifest.xml", "host\host.jsx", "client\panel.js", "lib\assembly.js", "engine\sync.js", "vendor\ffmpeg\win32-x64\ffmpeg.exe") {
            if (-not (Test-Path (Join-Path $ext $f))) { throw "missing after install: $f" }
          }
          if ((Get-ItemProperty "HKCU:\Software\Adobe\CSXS.11").PlayerDebugMode -ne "1") { throw "PlayerDebugMode not set" }
      - name: Timecode from a camera-like clip with the bundled ffmpeg
        run: node scripts/smoke-test.js
      - name: In-panel updater installs a package from an update folder
        shell: pwsh
        timeout-minutes: 8
        run: node scripts/update-test.js dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-smoke-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: PodGrip-Windows, path: dist }
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "PodGrip $GITHUB_REF_NAME" \
            --notes "Windows installer: download PodGrip-*-Windows.zip, unzip, double-click **Install PodGrip.bat**, then restart Premiere Pro and open Window > Extensions > PodGrip. Installed panels offer this update themselves."
