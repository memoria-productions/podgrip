<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PodGrip</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="logo">&#9638;</span> PodGrip</div>
    <span class="muted" id="ver"></span>
    <button id="btnRefresh" class="btn ghost small" title="Look at the open project again">Refresh</button>
  </header>

  <section class="card">
    <h2>Episode</h2>
    <div id="epBox" class="muted">Looking at the open project…</div>
  </section>

  <section class="card">
    <button id="btnBegin" class="btn primary wide" disabled>Begin episode assembly</button>
    <ol class="steps" id="steps">
      <li data-step="rename">Rename the template's ### sequences</li>
      <li data-step="sync">Read the timecode and sync the footage and audio</li>
      <li data-step="write">Write the assembly XML next to the project</li>
      <li data-step="import">Import it into a PodGrip bin</li>
    </ol>
    <div id="status" class="status"></div>
  </section>

  <section class="card hidden" id="nextBox">
    <h2>Last step, in Premiere</h2>
    <p id="nextText"></p>
  </section>

  <details class="card">
    <summary>Log</summary>
    <pre id="log" class="log"></pre>
  </details>
</div>
<script src="./lib/CSInterface.js"></script>
<script src="./panel.js"></script>
</body>
</html>
